<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Abolotse</title>
    <link rel="stylesheet" href="../../ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <img src="../../assets/icon.svg" alt="" width="28" height="28" />
      <h1 data-i18n="extName"></h1>
      <label class="switch">
        <input type="checkbox" id="enabled" role="switch" />
        <span data-i18n="popupEnabled"></span>
      </label>

    <section id="status" aria-live="polite">
      <p id="status-text"></p>
      <button type="button" id="open-target" hidden></button>
    </section>
    <footer>
      <a href="#" id="settings" data-i18n="popupSettings"></a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
